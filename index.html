<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular factorial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        <h1>Calcular factorial</h1>
    </div>

    <div id="container-form">



        <form id="form">
            <div id="container-form">
                <label for="number">Ingresa un número</label>
                <input type="text" id="number" placeholder="Ejemplo: 5" required>
            </div>

            <div id="container-btn">
                    <button id="btn-result" type="button">Calcular factorial</button>
                    <button id="btn-clean" type="button">Ingresa otro valor</button>
            </div>
        </form>
    </div>

    <div id="result"></div>

    <script src="./script.js"></script>
  
</body>
</html>
